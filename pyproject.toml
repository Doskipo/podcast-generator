[project]
name = "podcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Doskipo", email = "eudaldborrell8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.67.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.10.0",
    "pydantic>=2.13.5",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "trafilatura>=2.2.0",
]

[project.scripts]
podcast = "podcast.generate:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
